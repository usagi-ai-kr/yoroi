name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # qketing과 동일 pin
        with:
          persist-credentials: false
      - name: Validate repository and skills
        run: python3 scripts/validate-repo.py
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          install: false
      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile
      - name: Check (typecheck, tests, BDD, build)
        run: pnpm run check
