name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # qketing과 동일 pin
        with:
          persist-credentials: false
      - name: Validate repository and skills
        run: python3 scripts/validate-repo.py
